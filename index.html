<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover Studio — GTA 6 style cover art, in your browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Cover Studio</h1>
  <p class="tag">Build a GTA 6 style cover from your own photos. Offline, no upload, no account.</p>
</header>
<main>
  <section class="stage-wrap">
    <canvas id="stage" width="1080" height="1080"></canvas>
    <div class="hint">Drag a photo to move it &middot; use the zoom sliders to frame it</div>
  </section>
  <section class="panel">
    <h2>Layout</h2>
    <div class="row" id="layoutRow">
      <button data-layout="hero" class="active">Hero</button>
      <button data-layout="split">Split</button>
      <button data-layout="trio">Trio</button>
    </div>
    <h2>Photos</h2>
    <div id="slots"></div>
    <h2>Caption</h2>
    <label>Title <input id="titleInput" type="text" value="VICE CITY DAWN" maxlength="40"></label>
    <label>Subtitle <input id="subtitleInput" type="text" value="Every sunrise is a getaway." maxlength="80"></label>
    <h2>Grade</h2>
    <div class="row" id="gradeRow">
      <button data-grade="original" class="active">Original</button>
      <button data-grade="vice">Vice Sunset</button>
      <button data-grade="neon">Neon Night</button>
      <button data-grade="noir">Noir</button>
    </div>
    <div class="row">
      <button id="randomBtn" title="Random layout + grade">🎲 Randomize</button>
      <label class="check"><input type="checkbox" id="grainToggle" checked> Film grain</label>
    </div>
    <h2>Export PNG</h2>
    <div class="row">
      <button data-export="1080x1080">1080 &times; 1080</button>
      <button data-export="1080x1350">1080 &times; 1350</button>
      <button data-export="1920x1080">1920 &times; 1080</button>
    </div>
    <p class="note">Your photos never leave this page — everything runs locally in the browser.</p>
  </section>
</main>
<script src="sample.js"></script>
<script src="app.js"></script>
</body>
</html>
